services:
  - type: web
    name: bureauq
    env: python
    region: oregon
    plan: starter          # $7/mo — always-on, no spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /login
    disk:
      name: sanctions-db
      mountPath: /data
      sizeGB: 1            # $0.25/mo — persists the SQLite DB across deploys
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a secure random value
      - key: DB_PATH
        value: /data/sanctions.db
      - key: RESEND_API_KEY
        sync: false           # You'll paste this in the Render dashboard
      - key: RESEND_FROM
        sync: false           # e.g. "bureauq <noreply@yourdomain.com>"
      - key: STRIPE_SECRET_KEY
        sync: false           # sk_live_... from Stripe dashboard
      - key: STRIPE_WEBHOOK_SECRET
        sync: false           # whsec_... from Stripe webhook settings
      - key: STRIPE_PRICE_STARTER
        sync: false           # price_... for £49/mo product
      - key: STRIPE_PRICE_PROFESSIONAL
        sync: false           # price_... for £149/mo product
      - key: PYTHON_VERSION
        value: "3.11.0"
